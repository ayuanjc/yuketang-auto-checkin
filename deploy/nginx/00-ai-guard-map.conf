# AI/爬虫 UA 识别（http 级 map，2026-11-16 建立 / 2026-11-17 夜间加固）
# 两档策略，避免"一刀切"误伤正常用户：
#   $ai_bot   → AI 训练/索引爬虫：返回 200 诱饵页（抓得到，但全是无效样本）
#   $tool_bot → 脚本 / HTTP 库 / 无头浏览器 / 空 UA：直接 403（正常浏览器不受影响）
# 站内运维与监控需要脚本访问时，带请求头  X-Ykt-Probe: <token>  即放行；
# 本机回环（127.0.0.1 / ::1）恒放行，便于 healthcheck。

map $http_user_agent $ai_bot {
    default 0;
    "~*(GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-Web|Claude-SearchBot|anthropic-ai|Bytespider|CCBot|Google-Extended|PerplexityBot|Perplexity-User|Applebot-Extended|meta-externalagent|meta-externalfetcher|FacebookBot|Amazonbot|YouBot|Diffbot|omgili|ImagesiftBot|cohere-ai|Timpibot|ICC-Crawler|img2dataset|HTTrack|MJ12bot|AhrefsBot|SemrushBot|DataForSeoBot|Barkrowler|PetalBot|BLEXBot|SeznamBot|MegaIndex|SiteAuditBot)" 1;
}

# ── 脚本/工具/无头浏览器指纹（命中即 403）─────────────────────────────
# 只放"人类浏览器绝不会发"的 token：requests/curl/aiohttp/Go/Java/okhttp/
# headless 系/扫描器系/空 UA。Chrome、Safari、微信内置浏览器、QQ 浏览器均不含上述串。
map $http_user_agent $tool_bot {
    default 0;

    ""                                                                  1;   # 空 UA
    "~*(python-requests|python-urllib|Python-urllib|python-httplib2|urllib3|aiohttp|httpx|requests/[0-9]|Scrapy|scrapy|mechanize|Mechanize|libwww-perl|LWP::Simple|WWW-Mechanize|GuzzleHttp|RestSharp|curl/|CURL/|Wget/|wget/|Go-http-client|golang|Go/1|Java/[0-9]|Apache-HttpClient|okhttp|node-fetch|axios/|undici|PostmanRuntime|insomnia|httpie|HTTPie|WinHttp|WinHTTP|Ruby/H|PHP/H|Dalvik/)" 1;
    "~*(HeadlessChrome|headless_chrome|Headless|Puppeteer|Playwright|Selenium|selenium|PhantomJS|SlimerJS|Nightmare|jsdom|Chrome-Lighthouse|Lighthouse|electron|Electron|Cypress|Webdriver|webdriver)" 1;
    "~*(sqlmap|SQLMap|nikto|Nikto|nuclei|Nuclei|gobuster|Gobuster|dirbuster|DirBuster|dirsearch|wfuzz|Wfuzz|ffuf|masscan|zgrab|nmap|Nmap|hydra|Hydra|WPScan|wpscan|Acunetix|acunetix|Netsparker|AppScan|BurpSuite|Burp|ZAP|zaproxy|Nessus|OpenVAS|arachni|whatweb|w3af|jaeles|Censys|Shodan|InternetMeasurement)" 1;
}

# 脚本放行通道：带这个头的请求视为站内运维/监控（token 变更需同步运维脚本）
map $http_x_ykt_probe $ykt_probe_ok {
    default 0;
    "aa168724c4e41ad4ae4a9fc8d3c41645" 1;
}

map $remote_addr $ykt_loopback {
    default 0;
    "127.0.0.1" 1;
    "::1"       1;
}

# tool_bot=1 即命中脚本指纹；运维通道与回环的豁免在 snippets/ai-guard.conf 里用 set 链处理
# （nginx 的 map 对"多变量拼接源"匹配不可靠，实测 "1"+"0"+"0" 不命中 "1000"，故拆成单变量 + set）
map $tool_bot $bot_deny {
    default 0;
    "1"     1;
}

# AI 爬虫专用日志格式（http 级；access_log 在 snippets/ai-guard.conf 里按 if 引用）
log_format aibot '$remote_addr - [$time_local] "$request" $status "$http_user_agent"';
