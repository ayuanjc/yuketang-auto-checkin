# 带版本号静态资源长缓存（2026-11-17 夜间优化：静态首屏从每次重下改为命中本地缓存）
# 只对「路径.扩展名?v=版本号」生效；index.html 与无版本号 URL 仍是 no-cache，
# 发布新版本时只需改 index.html 里的 ?v= 值，浏览器立刻取新文件。
map $request_uri $ykt_asset_cc {
    default "no-cache";
    "~*[.](?:js|css|woff2?|ttf|otf|png|jpe?g|webp|svg|ico)[?]v=[0-9A-Za-z._-]+$" "public, max-age=31536000, immutable";
}
