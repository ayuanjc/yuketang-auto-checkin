# 雨课堂控制台反代（2026-11-16 前端重建 / 2026-11-17 夜间防爬加固）
# 上游：web.py 8080（站点/后台）→ svc.py 8090（协议核心，仅本机）
# 限速分区定义在 sites-enabled/yktsign-live.conf（http 级）：
#   yktapi 180r/m · yktlogin 10r/m · yktpoll 40r/m · yktstatic 600r/m · yktbind 30r/m · yktconn 并发
# 所有 429 用 limit_req_status / limit_conn_status 显式声明，便于前端识别"被限速"而非"服务出错"。

# ── 用户站（纯静态，nginx 直出）───────────────────────────────────
location ^~ /ykt/u/ {
    alias /opt/yktsign/web2/;
    index index.html;
    autoindex off;

    # 静态资源同样限速：正常首屏 4~8 个请求，脚本狂拉会被 429（防整站镜像）
    limit_req zone=yktstatic burst=60 nodelay;
    limit_conn yktconn 16;
    limit_req_status 429;
    limit_conn_status 429;

    # alias 会跳过外层 /ykt/ 的 deny 规则，这里必须再挡一遍：
    # 源码 / source map / 数据库 / 备份 / 隐藏文件一律 404（不给指纹，不给内容）
    if ($uri ~* "\.(py|pyc|pyd|pyo|map|db|sqlite3?|key|pem|crt|log|sql|sh|bak|old|swp|tar|gz|zip|jsonl|out|err|env)$") { return 404; }
    if ($uri ~ "/\.") { return 404; }

    try_files $uri $uri/ =404;
    add_header X-Frontend "static" always;
    add_header Cache-Control $ykt_asset_cc always;
    include /etc/nginx/snippets/ykt-headers-static.inc;
    include /etc/nginx/snippets/ykt-csp.inc;
}

# 旧控制台已下线
location ^~ /ykt/app/ { return 301 /ykt/u/; }

# ── 管理后台（纯静态）──────────────────────────────────────────────
location ^~ /ykt/admin/ {
    alias /opt/yktsign/admin_web/;
    index index.html;
    autoindex off;

    limit_req zone=yktstatic burst=40 nodelay;
    limit_conn yktconn 12;
    limit_req_status 429;
    limit_conn_status 429;

    if ($uri ~* "\.(py|pyc|pyd|pyo|map|db|sqlite3?|key|pem|crt|log|sql|sh|bak|old|swp|tar|gz|zip|jsonl|out|err|env)$") { return 404; }
    if ($uri ~ "/\.") { return 404; }

    try_files $uri $uri/ =404;
    add_header X-Frontend "static" always;
    add_header Cache-Control $ykt_asset_cc always;
    include /etc/nginx/snippets/ykt-headers-static.inc;
    include /etc/nginx/snippets/ykt-csp.inc;
}

location = /ykt { return 302 /ykt/u/; }
location = /ykt/ { return 302 /ykt/u/; }

location ^~ /ykt/ {
    # 只允许读写常规方法；PUT/DELETE/TRACE 一律 405
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) { return 405; }

    limit_req zone=yktapi burst=120 nodelay;
    limit_conn yktconn 24;
    limit_req_status 429;
    limit_conn_status 429;

    # 源码、凭据、数据库、备份一律不对外（web.py DENY 双保险）
    location ~* \.(py|pyc|pyd|pyo|map|db|sqlite3?|key|pem|crt|log|sql|sh|bak|old|swp|tar|gz|zip|jsonl|out|err|env)$ { deny all; }
    location ~* /(accounts|events|__pycache__)/ { deny all; }
    location ~* /(accounts|events)\.json$ { deny all; }
    location ~* /(cookies|lesson_auth|scan_exchange|svc_token|secret)([._][a-z0-9]+)?\.(json|key|txt)?$ { deny all; }

    proxy_pass http://127.0.0.1:8080/;
    include snippets/ykt-proxy.inc;
    include snippets/ykt-headers.inc;
}

# 扫码状态轮询：单标签页约 1 请求/秒，这里单独收紧，防多开/脚本刷
location = /ykt/api/app/bind/qr/poll {
    limit_req zone=yktpoll burst=20 nodelay;
    limit_conn yktconn 8;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8080/api/app/bind/qr/poll;
    include snippets/ykt-proxy.inc;
    include snippets/ykt-headers.inc;
}

# 绑定二维码创建/兑换：独立档，防脚本批量造码刷号（正常用户一次绑定只造 1~2 个码）
location ^~ /ykt/api/app/bind/ {
    limit_req zone=yktbind burst=10 nodelay;
    limit_conn yktconn 8;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8080/api/app/bind/;
    include snippets/ykt-proxy.inc;
    include snippets/ykt-headers.inc;
}

# 登录接口：更严限速（应用层另有 8 次 / 300 秒锁定）
location = /ykt/api/biz/login {
    limit_req zone=yktlogin burst=5 nodelay;
    limit_conn yktconn 8;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8080/api/biz/login;
    include snippets/ykt-proxy.inc;
    include snippets/ykt-headers.inc;
}

# 注册 / 登出 / 会话：同一档
location ^~ /ykt/api/biz/register {
    limit_req zone=yktlogin burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8080/api/biz/register;
    include snippets/ykt-proxy.inc;
    include snippets/ykt-headers.inc;
}
