# ykt 撞库 / 机器人强攻判定（2026-11-17 夜间加固）
#
# 判定面：nginx access.log 中状态码为 401/403/429 的任意请求。
#   429 = yktlogin(10r/m)/yktapi/yktstatic 限流命中，或应用层「密码错 8 次」锁定；
#   403 = ai-guard 的 UA 指纹拦截（python-requests/curl/scrapy/headless/空 UA/扫描器）；
#   401 = 鉴权失败。
# 单个真实用户 10 分钟内不会产生 6 次以上这类响应。
#
# 形状说明（实测坑，勿改）：本机 fail2ban 1.0.2 下，在 .+ 与 HTTP/ 之间插入任何字面量
# 或 [^...] 字符类（/ykt/、login、[^"]+ 等）都会 0 命中；唯一稳定形状是
#   ^<HOST> - - \S+ \S+ .+ HTTP/[0-9.]+" 状态码
# 用 203.0.113.x 合成日志 + 临时 jail 逐条验证过。改规则前请先同法复验。
[Definition]

failregex = ^<HOST> - - \S+ \S+ .+ HTTP/[0-9.]+" (401|403|429)

ignoreregex =
