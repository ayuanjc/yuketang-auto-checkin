# ykt 雨课堂控制台 专项封禁（2026-11-17 夜间加固）
# 判据：撞库/强攻（401·403·429）+ 路径枚举（404）。
# 坑1：jail.local 的 [DEFAULT] 有 backend = systemd，必须逐 jail 显式覆盖为 auto，
#      否则 logpath 被忽略、改读 journal，永不命中。
# 坑2：failregex 形状必须实测（见 filter.d/ykt-auth.conf 顶部注释）。
# ignoreip 含本站出口 IP 203.0.113.10，避免自测/监控把自己封了。

[ykt-auth-nginx]
backend  = auto
enabled  = true
filter   = ykt-auth
port     = http,https
logpath  = /var/log/nginx/yktsign-live.access.log
maxretry = 6
findtime = 10m
bantime  = 12h
ignoreip = 127.0.0.1/8 ::1 203.0.113.10

[ykt-404]
backend  = auto
enabled  = true
filter   = ykt-404
port     = http,https
logpath  = /var/log/nginx/yktsign-live.access.log
maxretry = 12
findtime = 10m
bantime  = 4h
ignoreip = 127.0.0.1/8 ::1 203.0.113.10
